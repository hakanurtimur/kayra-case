services:
  cart:
    image: kayra-cart
    build:
      context: .
      dockerfile: apps/cart/Dockerfile
    ports:
      - "3002:3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require("node:http").get("http://127.0.0.1:3002/cart", (response) =>
          process.exit(response.statusCode === 200 ? 0 : 1)).on("error", () =>
          process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  home:
    image: kayra-home
    build:
      context: .
      dockerfile: apps/home/Dockerfile
      args:
        CART_ORIGIN: http://cart:3002
    ports:
      - "3000:3000"
    depends_on:
      cart:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require("node:http").get("http://127.0.0.1:3000/", (response) =>
          process.exit(response.statusCode === 200 ? 0 : 1)).on("error", () =>
          process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
